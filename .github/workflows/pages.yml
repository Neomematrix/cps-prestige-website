name: Publish CPS website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and verify website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          QUOTE_FORM_URL: ${{ vars.QUOTE_FORM_URL }}
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/test_quote_behavior.cjs
          python3 build_github_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
